# Fly.io config. Deploy: `fly launch --no-deploy` then `fly deploy`.
# Set secrets with: fly secrets set ANTHROPIC_API_KEY=... JWT_SECRET=... STRIPE_SECRET_KEY=... etc.
app = "crucible"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/crucible.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "crucible_data"
  destination = "/data"
