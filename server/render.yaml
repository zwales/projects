# Render blueprint. Deploy: push to a repo, then "New > Blueprint" and point at this file.
#
# Free-tier note: free web services can't attach a persistent disk, so this
# blueprint provisions a free Postgres database and wires DATABASE_URL to it
# instead of using the SQLite/disk path. If you're on a paid plan and would
# rather use SQLite with a persistent disk, drop the `databases:` block and
# the `DATABASE_URL` env var below, and re-add a `disk:` block on the service
# (see git history for the previous version).
databases:
  - name: crucible-db
    plan: free
    databaseName: crucible
    user: crucible

services:
  - type: web
    name: crucible
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crucible-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the dashboard (secret)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false          # set to your real https domain
      - key: ADMIN_EMAILS
        sync: false
      - key: REDIS_URL
        sync: false
